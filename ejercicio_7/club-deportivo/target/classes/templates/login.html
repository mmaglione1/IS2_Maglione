<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Club Deportivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock-fill text-primary display-4"></i>
                <h3 class="fw-bold mt-2">Club Deportivo</h3>
                <p class="text-muted">Control de Acceso y Gestión de Cuotas</p>
            </div>
            <div th:if="${param.error}" class="alert alert-danger">Credenciales no válidas.</div>
            <div th:if="${param.logout}" class="alert alert-info">Sesión cerrada exitosamente.</div>
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Usuario</label>
                            <input type="text" name="username" class="form-control" placeholder="admin o porteria" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Clave</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-semibold">Ingresar</button>
                    </form>
                </div>
            </div>
            <div class="text-center text-muted small mt-4">
                Acceso por defecto: <strong>admin</strong> / <strong>admin123</strong>
            </div>
        </div>
    </div>
</div>
</body>
</html>
