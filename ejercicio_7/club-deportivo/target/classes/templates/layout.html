<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${titulo}">Club Deportivo</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR PRINCIPAL -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/accesos}">
      <i class="bi bi-shield-check text-warning me-2"></i>Club Deportivo
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/accesos}"><i class="bi bi-camera me-1"></i>Control Accesos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" th:href="@{/socios}"><i class="bi bi-people me-1"></i>Socios & Familias</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/pagos}"><i class="bi bi-cash-stack me-1"></i>Gestión Pagos</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3">
                    <span class="text-light small">
                        <i class="bi bi-person-badge me-1"></i>
                        <span sec:authentication="name">Operador</span>
                    </span>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button class="btn btn-outline-danger btn-sm" type="submit">
            <i class="bi bi-box-arrow-right"></i> Salir
          </button>
        </form>
      </div>
    </div>
  </div>
</nav>

<!-- FOOTER COMÚN -->
<footer th:fragment="footer" class="py-3 bg-dark text-white-50 text-center mt-auto">
  <div class="container"><small>&copy; 2026 Club Deportivo - Sistema de Control Facial & Cobros</small></div>
</footer>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
