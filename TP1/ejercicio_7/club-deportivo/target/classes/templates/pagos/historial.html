<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Historial de Pagos')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container my-5">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-cash-stack text-success me-2"></i>Historial de Cuotas</h2>
            <p class="text-muted mb-0">Listado de pagos familiares asentados con diferentes medios de pago</p>
        </div>
        <a th:href="@{/pagos/nuevo}" class="btn btn-success fw-semibold">
            <i class="bi bi-plus-circle me-1"></i> Cobrar Cuota
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Fecha de Pago</th>
                        <th>Titular / Familia</th>
                        <th>DNI Titular</th>
                        <th>Período</th>
                        <th>Monto Abonado</th>
                        <th>Medio de Pago</th>
                        <th class="pe-4">Comprobante</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="pago : ${pagos}">
                        <td class="ps-4 text-muted fw-bold" th:text="'#' + ${pago.id}"></td>
                        <td th:text="${#temporals.format(pago.fechaPago, 'dd/MM/yyyy HH:mm')}"></td>
                        <td class="fw-semibold text-dark" th:text="${pago.titularNombreCompleto}"></td>
                        <td th:text="${pago.titularDni}"></td>
                        <td>
                            <span class="badge bg-secondary" th:text="${pago.periodo}"></span>
                        </td>
                        <td class="fw-bold text-success" th:text="'$' + ${#numbers.formatDecimal(pago.monto, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                                    <span class="badge px-2 py-1"
                                          th:classappend="${pago.medioPago.name() == 'MERCADO_PAGO'} ? 'bg-info text-dark' : (${pago.medioPago.name() == 'EFECTIVO'} ? 'bg-success' : 'bg-primary')"
                                          th:text="${pago.medioPago}"></span>
                        </td>
                        <td class="pe-4 text-muted small" th:text="${pago.comprobanteReferencia != null and !pago.comprobanteReferencia.isEmpty()} ? ${pago.comprobanteReferencia} : '-'"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pagos)}">
                        <td colspan="8" class="text-center py-5 text-muted">
                            <i class="bi bi-receipt display-4 d-block mb-3 text-secondary"></i>
                            No se han registrado pagos de cuotas todavía.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
