<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Registrar Pago de Cuota')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-dark text-white py-3">
                    <h4 class="card-title fw-bold mb-0"><i class="bi bi-wallet2 me-2"></i>Cobro de Cuota Familiar</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/pagos/guardar}" th:object="${pagoDTO}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Familia / Socio Titular *</label>
                            <select th:field="*{socioId}" class="form-select" required>
                                <option value="" disabled selected>-- Seleccione el Titular --</option>
                                <option th:each="s : ${socios}" th:value="${s.id}"
                                        th:text="${s.nombreCompleto} + ' (DNI: ' + ${s.dni} + ')'"></option>
                            </select>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Mes *</label>
                                <input type="number" th:field="*{mes}" min="1" max="12" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Año *</label>
                                <input type="number" th:field="*{anio}" min="2020" max="2030" class="form-control" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Monto Total ($) *</label>
                                <input type="number" step="0.01" th:field="*{monto}" class="form-control" placeholder="0.00" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Medio de Pago *</label>
                                <select th:field="*{medioPago}" class="form-select" required>
                                    <option th:each="m : ${mediosPago}" th:value="${m}" th:text="${m}"></option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">Comprobante / Nro. Transacción</label>
                            <input type="text" th:field="*{comprobanteReferencia}" class="form-control" placeholder="Ej: MP-982348 o Recibo 001-123">
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/pagos}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success fw-semibold px-4">
                                <i class="bi bi-check-lg me-1"></i> Asentar Pago
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
