<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Padrón de Socios')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container my-5">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-1"><i class="bi bi-people-fill text-primary me-2"></i>Padrón de Socios y Familias</h2>
            <p class="text-muted mb-0">Gestión de socios titulares, grupo familiar y perfiles biométricos</p>
        </div>
        <a th:href="@{/socios/nuevo}" class="btn btn-primary fw-semibold">
            <i class="bi bi-person-plus-fill me-1"></i> Nuevo Titular
        </a>
    </div>

    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Rostro</th>
                        <th>DNI</th>
                        <th>Socio Titular</th>
                        <th>Correo Electrónico</th>
                        <th>Grupo Familiar</th>
                        <th class="text-center pe-4">Acción</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="socio : ${socios}">
                        <td class="ps-4">
                            <img th:if="${socio.tieneFoto}" th:src="@{'/foto/socio/' + ${socio.id}}"
                                 class="rounded-circle border" style="width: 50px; height: 50px; object-fit: cover;">
                            <img th:unless="${socio.tieneFoto}" src="https://dummyimage.com/60x60/dee2e6/6c757d.jpg&text=Sin+Foto"
                                 class="rounded-circle border" style="width: 50px; height: 50px; object-fit: cover;">
                        </td>
                        <td class="fw-bold" th:text="${socio.dni}"></td>
                        <td class="fw-semibold text-dark" th:text="${socio.nombreCompleto}"></td>
                        <td th:text="${socio.email != null ? socio.email : '-'}"></td>
                        <td>
                            <span th:if="${#lists.isEmpty(socio.familiaresNombres)}" class="text-muted small">Sin familiares</span>
                            <ul th:unless="${#lists.isEmpty(socio.familiaresNombres)}" class="list-unstyled mb-0 small">
                                <li th:each="fam : ${socio.familiaresNombres}">
                                    <i class="bi bi-person-fill text-secondary me-1"></i><span th:text="${fam}"></span>
                                </li>
                            </ul>
                        </td>
                        <td class="text-center pe-4">
                            <button type="button" class="btn btn-outline-primary btn-sm"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="'#modalFamiliar' + ${socio.id}">
                                <i class="bi bi-plus-lg me-1"></i>Familiar
                            </button>

                            <!-- Modal Asociar Familiar -->
                            <div class="modal fade text-start" th:id="'modalFamiliar' + ${socio.id}" tabindex="-1" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content">
                                        <div class="modal-header bg-primary text-white">
                                            <h5 class="modal-title fw-bold">Asociar Familiar a <span th:text="${socio.nombreCompleto}"></span></h5>
                                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                        </div>
                                        <form th:action="@{/socios/familiar/guardar}" method="post" enctype="multipart/form-data">
                                            <input type="hidden" name="socioTitularId" th:value="${socio.id}">
                                            <div class="modal-body p-4">
                                                <div class="mb-3">
                                                    <label class="form-label fw-semibold">DNI *</label>
                                                    <input type="text" name="dni" class="form-control" required>
                                                </div>
                                                <div class="row mb-3">
                                                    <div class="col-md-6">
                                                        <label class="form-label fw-semibold">Nombre *</label>
                                                        <input type="text" name="nombre" class="form-control" required>
                                                    </div>
                                                    <div class="col-md-6">
                                                        <label class="form-label fw-semibold">Apellido *</label>
                                                        <input type="text" name="apellido" class="form-control" required>
                                                    </div>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-semibold">Parentesco *</label>
                                                    <select name="parentesco" class="form-select" required>
                                                        <option value="Hijo/a">Hijo/a</option>
                                                        <option value="Cónyuge">Cónyuge</option>
                                                        <option value="Padre/Madre">Padre/Madre</option>
                                                        <option value="Hermano/a">Hermano/a</option>
                                                    </select>
                                                </div>
                                                <div class="mb-3">
                                                    <label class="form-label fw-semibold">Foto del Rostro (LONGBLOB)</label>
                                                    <input type="file" name="foto" class="form-control" accept="image/*">
                                                </div>
                                            </div>
                                            <div class="modal-footer bg-light">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                                <button type="submit" class="btn btn-primary fw-semibold">Registrar Familiar</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(socios)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-person-x display-4 d-block mb-3 text-secondary"></i>
                            No hay socios registrados. Presiona "Nuevo Titular" para comenzar.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
