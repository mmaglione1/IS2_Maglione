<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Registrar Socio')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white py-3">
                    <h4 class="card-title fw-bold mb-0"><i class="bi bi-person-vcard me-2"></i>Alta de Socio Titular</h4>
                </div>
                <div class="card-body p-4">
                    <form th:action="@{/socios/guardar}" th:object="${socioDTO}" method="post" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">DNI *</label>
                            <input type="text" th:field="*{dni}" class="form-control" placeholder="Número de Documento" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Nombre *</label>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Lionel" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Apellido *</label>
                                <input type="text" th:field="*{apellido}" class="form-control" placeholder="Ej: Messi" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="socio@correo.com">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Fotografía del Rostro (LONGBLOB en MySQL) *</label>
                            <input type="file" th:field="*{foto}" class="form-control" accept="image/*" required>
                            <small class="text-muted">Se almacenará en formato binario para el reconocimiento en accesos.</small>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/socios}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary fw-semibold px-4">
                                <i class="bi bi-save me-1"></i> Guardar Titular
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
