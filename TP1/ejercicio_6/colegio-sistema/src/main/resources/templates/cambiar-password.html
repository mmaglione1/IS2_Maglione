<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Cambiar Contraseña')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container my-auto py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="card-title fw-bold mb-0"><i class="bi bi-key me-2"></i>Cambiar Contraseña</h5>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/cambiar-password}" th:object="${cambioPasswordDTO}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Contraseña Actual *</label>
                            <input type="password" class="form-control" th:field="*{claveActual}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nueva Contraseña *</label>
                            <input type="password" class="form-control" th:field="*{claveNueva}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Confirmar Nueva Contraseña *</label>
                            <input type="password" class="form-control" th:field="*{confirmarClaveNueva}" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success fw-semibold py-2">Actualizar Contraseña</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
