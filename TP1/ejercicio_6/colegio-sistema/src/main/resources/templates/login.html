<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Acceso Institucional - Colegio')}"></head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <div class="text-center mb-4">
                <i class="bi bi-mortarboard-fill text-primary display-4"></i>
                <h2 class="fw-bold mt-2">Colegio San Martín</h2>
                <p class="text-muted">Plataforma de Gestión Docente</p>
            </div>

            <!-- Alertas dinámicas -->
            <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Error de autenticación</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${exito != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${exito}">Operación exitosa</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <form th:action="@{/login-process}" method="POST">

                        <div class="mb-3">
                            <label for="correoPersonal" class="form-label fw-semibold">Correo Personal (Usuario)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="correoPersonal" name="correoPersonal" placeholder="docente@colegio.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="clave" class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="clave" name="clave" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary fw-semibold py-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Sistema
                            </button>
                        </div>

                        <div class="text-center">
                            <span class="text-muted small">¿No estás registrado? </span>
                            <a th:href="@{/registro-docente}" class="small fw-semibold text-decoration-none">Regístrate aquí</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
