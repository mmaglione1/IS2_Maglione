# ==============================================================================
# 1. CONFIGURACIÓN DEL SERVIDOR WEB (Tomcat Embebido)
# ==============================================================================
# Puerto HTTP en el que escuchará la aplicación
server.port=8080
spring.application.name=colegio-sistema

# ==============================================================================
# 2. CAPA DE PERSISTENCIA: CONEXIÓN A BASE DE DATOS MYSQL (JDBC)
# ==============================================================================
# URL de conexión:
# - localhost:3306: Puerto del motor MySQL
# - colegio_db: Esquema de base de datos
# - createDatabaseIfNotExist=true: Crea la base de datos si aún no existe
# - serverTimezone=UTC: Estandariza fechas para el registro de nacimientos y notas
spring.datasource.url=jdbc:mysql://localhost:3306/colegio_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# 3. CONFIGURACIÓN DEL ORM (JPA / HIBERNATE)
# ==============================================================================
# update: Hibernate crea o actualiza las tablas basándose en las clases @Entity
spring.jpa.hibernate.ddl-auto=update

# Dialecto optimizado para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Muestra y formatea las consultas SQL en la consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactiva open-in-view para asegurar la separación estricta de capas
spring.jpa.open-in-view=false

# ==============================================================================
# 4. AUDITORÍA DE ENTIDADES (HIBERNATE ENVERS)
# ==============================================================================
# Sufijo que se agregará a las tablas de auditoría (ej: docentes_aud, notas_aud)
org.hibernate.envers.audit_table_suffix=_aud
# Nombre del campo que indica el tipo de modificación (0: INSERT, 1: UPDATE, 2: DELETE)
org.hibernate.envers.revision_type_field_name=revtype
# Nombre del campo con el ID de revisión vinculado a la tabla REVINFO
org.hibernate.envers.revision_field_name=rev

# ==============================================================================
# 5. CONFIGURACIÓN DE CORREO SMTP (MAILTRAP - SANDBOX DE PRUEBA)
# ==============================================================================
# Mailtrap intercepta los correos de bienvenida sin enviarlos a buzones reales
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=f5481da672a53a
spring.mail.password=6a83de25ff46d8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ==============================================================================
# 6. CONFIGURACIÓN DEL MOTOR DE VISTAS (THYMELEAF)
# ==============================================================================
# Ubicación de las plantillas HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Desactiva la caché para que los cambios en HTML/Bootstrap se vean al recargar
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML