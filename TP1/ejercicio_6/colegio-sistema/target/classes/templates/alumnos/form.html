<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Matricular Alumno')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container my-auto py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-primary text-white py-3">
                    <h5 class="card-title fw-bold mb-0"><i class="bi bi-person-plus me-2"></i>Formulario de Alumno</h5>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/alumnos/guardar}" th:object="${alumnoDTO}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Documento *</label>
                            <input type="text" class="form-control" th:field="*{documento}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre *</label>
                            <input type="text" class="form-control" th:field="*{nombre}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Apellido *</label>
                            <input type="text" class="form-control" th:field="*{apellido}" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Grado y Aula Asignada *</label>
                            <select class="form-select" th:field="*{aulaId}" required>
                                <option value="" disabled selected>-- Seleccione Grado y Aula --</option>
                                <option th:each="au : ${aulas}" th:value="${au.id}" th:text="${au.descripcionCompleta}"></option>
                            </select>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/alumnos}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success fw-semibold px-4">Guardar Alumno</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
