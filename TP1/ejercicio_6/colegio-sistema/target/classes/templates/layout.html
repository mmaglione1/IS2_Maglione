<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Sistema Escolar</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

<!-- BARRA DE NAVEGACIÓN GENERAL -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-mortarboard-fill text-primary me-2"></i>Colegio San Martín
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/alumnos}"><i class="bi bi-people me-1"></i> Alumnos y Aulas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/notas/cargar}"><i class="bi bi-journal-check me-1"></i> Cargar Notas</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/cambiar-password}" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-key me-1"></i> Cambiar Clave
                </a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- FOOTER GENERAL -->
<footer th:fragment="footer" class="text-center text-muted py-4 mt-auto border-top bg-white">
    <div class="container">
        <small>&copy; 2026 Sistema Integral de Gestión Escolar - Arquitectura MVC & Spring Boot</small>
    </div>
</footer>

<!-- SCRIPTS COMUNES -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>
</body>
</html>
