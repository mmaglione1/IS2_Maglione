<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Carga de Calificaciones')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container my-auto py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-dark text-white py-3">
                    <h5 class="card-title fw-bold mb-0"><i class="bi bi-journal-check me-2"></i>Registrar Nota</h5>
                </div>
                <div class="card-body p-4">

                    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/notas/guardar}" th:object="${notaDTO}" method="POST">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Alumno *</label>
                            <select class="form-select" th:field="*{alumnoId}" required>
                                <option value="" disabled selected>-- Seleccione Alumno --</option>
                                <option th:each="al : ${alumnos}" th:value="${al.id}" th:text="${al.nombreCompleto} + ' (' + ${al.documento} + ')'"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Materia *</label>
                            <select class="form-select" th:field="*{materiaId}" required>
                                <option value="" disabled selected>-- Seleccione Materia --</option>
                                <option th:each="mat : ${materias}" th:value="${mat.id}" th:text="${mat.nombre}"></option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Calificación (1.0 a 10.0) *</label>
                                <input type="number" step="0.1" min="1.0" max="10.0" class="form-control" th:field="*{calificacion}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Período *</label>
                                <select class="form-select" th:field="*{periodo}" required>
                                    <option value="1° Trimestre">1° Trimestre</option>
                                    <option value="2° Trimestre">2° Trimestre</option>
                                    <option value="3° Trimestre">3° Trimestre</option>
                                    <option value="Examen Final">Examen Final</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Fecha de Evaluación *</label>
                            <input type="date" class="form-control" th:field="*{fechaEvaluacion}" required>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-success fw-semibold px-4">Asentar Calificación</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
