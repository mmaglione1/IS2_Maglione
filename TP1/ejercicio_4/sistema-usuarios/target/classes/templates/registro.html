<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personas - Sistema de Usuarios</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff007f 0%, #ff414d 50%, #ff6b35 100%);
            --btn-pink: #ff007f;
            --btn-pink-hover: #e0006f;
            --navbar-bg: #1c181b;
            --footer-bg: #000000;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #212529;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f8f9fa;
        }
        main { flex: 1; }
        .custom-navbar {
            background-color: var(--navbar-bg) !important;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }
        .hero-section {
            background: var(--primary-gradient);
            color: #ffffff;
            position: relative;
            overflow: hidden;
            padding: 3.5rem 1rem;
        }
        .btn-submit-pink {
            background-color: var(--btn-pink);
            color: #ffffff;
            border: none;
            font-weight: 600;
            padding: 0.6rem 1.8rem;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }
        .btn-submit-pink:hover {
            background-color: var(--btn-pink-hover);
            color: #ffffff;
        }
        .custom-footer {
            background-color: var(--footer-bg);
            color: #888888;
            padding: 1.5rem 0;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<!-- BARRA DE NAVEGACIÓN -->
<nav class="navbar navbar-expand navbar-dark custom-navbar py-2 px-3">
    <div class="container-fluid px-md-5">
        <a class="navbar-brand fw-bold text-uppercase" th:href="@{/}">Sistema de Usuarios</a>
        <div class="navbar-nav ms-auto gap-3">
            <a class="nav-link text-uppercase active" th:href="@{/registro}">Registro</a>
            <a class="nav-link text-uppercase" th:href="@{/login}">Iniciar Sesión</a>
        </div>
    </div>
</nav>

<main>
    <!-- HERO BANNER -->
    <header class="hero-section text-center">
        <div class="container position-relative" style="z-index: 2;">
            <h1 class="display-5 fw-bold mb-2">Crear Nueva Cuenta</h1>
            <p class="lead mb-0">Completa tus datos personales para acceder a la plataforma</p>
        </div>
    </header>

    <!-- FORMULARIO DE REGISTRO -->
    <section class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <!-- ALERTA DE ERROR GENERAL (Reglas de negocio: correo o documento duplicado) -->
                <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
                    <i class="bi bi-exclamation-triangle-fill fs-4 me-2"></i>
                    <div th:text="${error}">Error en el registro</div>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="h4 fw-bold mb-4 text-center">Formulario de Registro</h2>

                        <!-- FORMULARIO ENLAZADO AL MODELO 'usuario' -->
                        <form th:action="@{/registro}" th:object="${usuario}" method="POST" class="needs-validation">

                            <div class="row g-3">
                                <!-- Nombre -->
                                <div class="col-md-6">
                                    <label for="nombre" class="form-label fw-semibold">Nombre *</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''"
                                           placeholder="Ej. Juan" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                </div>

                                <!-- Apellido -->
                                <div class="col-md-6">
                                    <label for="apellido" class="form-label fw-semibold">Apellido *</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{apellido}"
                                           th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid' : ''"
                                           placeholder="Ej. Pérez" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></div>
                                </div>

                                <!-- Documento -->
                                <div class="col-md-6">
                                    <label for="documento" class="form-label fw-semibold">Documento de Identidad *</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{documento}"
                                           th:classappend="${#fields.hasErrors('documento')} ? 'is-invalid' : ''"
                                           placeholder="DNI / Cédula" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('documento')}" th:errors="*{documento}"></div>
                                </div>

                                <!-- Fecha de Nacimiento -->
                                <div class="col-md-6">
                                    <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de Nacimiento *</label>
                                    <input type="date"
                                           class="form-control"
                                           th:field="*{fechaNacimiento}"
                                           th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid' : ''"
                                           required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></div>
                                </div>

                                <!-- Correo Personal (Usuario de Login) -->
                                <div class="col-md-6">
                                    <label for="correoPersonal" class="form-label fw-semibold">Correo Personal (Identificador) *</label>
                                    <input type="email"
                                           class="form-control"
                                           th:field="*{correoPersonal}"
                                           th:classappend="${#fields.hasErrors('correoPersonal')} ? 'is-invalid' : ''"
                                           placeholder="usuario@correo.com" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('correoPersonal')}" th:errors="*{correoPersonal}"></div>
                                </div>

                                <!-- Clave -->
                                <div class="col-md-6">
                                    <label for="clave" class="form-label fw-semibold">Contraseña *</label>
                                    <input type="password"
                                           class="form-control"
                                           th:field="*{clave}"
                                           th:classappend="${#fields.hasErrors('clave')} ? 'is-invalid' : ''"
                                           placeholder="Mínimo 4 caracteres" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></div>
                                </div>

                                <!-- CAMPOS ADICIONALES -->
                                <!-- Teléfono -->
                                <div class="col-md-6">
                                    <label for="telefono" class="form-label fw-semibold">Teléfono de Contacto</label>
                                    <input type="tel"
                                           class="form-control"
                                           th:field="*{telefono}"
                                           placeholder="+54 9 11 1234-5678">
                                </div>

                                <!-- Dirección -->
                                <div class="col-md-6">
                                    <label for="direccion" class="form-label fw-semibold">Dirección de Residencia</label>
                                    <input type="text"
                                           class="form-control"
                                           th:field="*{direccion}"
                                           placeholder="Calle, Número, Ciudad">
                                </div>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-submit-pink btn-lg fs-6">
                                    <i class="bi bi-person-plus me-1"></i> Completar Registro
                                </button>
                            </div>

                            <div class="text-center mt-3">
                                <span class="text-muted small">¿Ya tienes una cuenta? </span>
                                <a th:href="@{/login}" class="fw-bold text-decoration-none" style="color: var(--btn-pink);">Inicia sesión</a>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </section>
</main>

<!-- FOOTER -->
<footer class="custom-footer text-center">
    <div class="container">
        <p class="m-0">&copy; 2026 Sistema de Gestión de Usuarios - Arquitectura MVC & Spring Boot</p>
    </div>
</footer>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
