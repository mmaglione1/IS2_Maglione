# ==============================================================================
# CONFIGURACIÓN DEL SERVIDOR WEB
# ==============================================================================
# Puerto HTTP en el que escuchará el servidor Tomcat embebido de Spring Boot
server.port=8080

# ==============================================================================
# CAPA DE PERSISTENCIA (ORM / BASE DE DATOS MYSQL)
# ==============================================================================
# URL de conexión JDBC:
# - localhost:3306: Dirección del servidor MySQL local.
# - sistema_usuarios: Nombre del esquema/base de datos.
# - serverTimezone=UTC: Estandariza la zona horaria para el manejo de fechas (ej. Fecha de Nacimiento).
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_usuarios?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Credenciales de acceso a MySQL (configuradas como root / root según la consigna)
spring.datasource.username=root
spring.datasource.password=1234

# Driver JDBC oficial de MySQL para establecer la comunicación por red
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA (Object-Relational Mapping)
# ==============================================================================
# ddl-auto=update:
# Hibernate inspecciona las clases anotadas con @Entity (como Usuario.java)
# y crea o actualiza las tablas y columnas automáticamente en MySQL sin borrar los datos existentes.
spring.jpa.hibernate.ddl-auto=update

# Dialecto SQL específico para optimizar las consultas generadas para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Muestra en la consola todas las sentencias SQL (INSERT, SELECT, UPDATE) generadas por el ORM
spring.jpa.show-sql=true

# Formatea las sentencias SQL en varias líneas para facilitar la depuración y lectura
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# CONFIGURACIÓN DE VISTAS (THYMELEAF)
# ==============================================================================
# Desactiva la caché de plantillas para que los cambios en los archivos HTML
# se reflejen de inmediato sin necesidad de reiniciar la aplicación en desarrollo.
spring.thymeleaf.cache=false

# Codificación de caracteres estándar para admitir tildes, 'ñ' y caracteres especiales
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML