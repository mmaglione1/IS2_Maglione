<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Registro de Operador</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="text-center mb-4">
                <i class="bi bi-person-badge-fill text-primary display-4"></i>
                <h2 class="fw-bold mt-2">Crear Cuenta de Operador</h2>
                <p class="text-muted">Ingresa los datos para acceder al sistema</p>
            </div>

            <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Error al registrar</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <form th:action="@{/registro}" th:object="${registroDTO}" method="POST">

                        <!-- Nombre Completo -->
                        <div class="mb-3">
                            <label for="nombreCompleto" class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text"
                                   class="form-control"
                                   id="nombreCompleto"
                                   th:field="*{nombreCompleto}"
                                   placeholder="Ej: Laura Martínez"
                                   th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
                        </div>

                        <!-- Nombre de Usuario -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Usuario del Sistema</label>
                            <input type="text"
                                   class="form-control"
                                   id="username"
                                   th:field="*{username}"
                                   placeholder="Ej: lmartinez"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label for="clave" class="form-label fw-semibold">Contraseña</label>
                            <input type="password"
                                   class="form-control"
                                   id="clave"
                                   th:field="*{clave}"
                                   placeholder="Mínimo 4 caracteres"
                                   th:classappend="${#fields.hasErrors('clave')} ? 'is-invalid' : ''" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></div>
                        </div>

                        <!-- Rol en la Empresa -->
                        <div class="mb-4">
                            <label for="rol" class="form-label fw-semibold">Rol Asignado</label>
                            <select class="form-select" id="rol" th:field="*{rol}">
                                <option value="COMPRADOR">Encargado de Compras</option>
                                <option value="ADMIN">Administrador General</option>
                            </select>
                        </div>

                        <!-- Botón de Envío -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary fw-semibold py-2">
                                <i class="bi bi-person-check me-1"></i> Registrar Operador
                            </button>
                        </div>

                        <div class="text-center">
                            <span class="text-muted small">¿Ya tienes usuario? </span>
                            <a th:href="@{/login}" class="small fw-semibold text-decoration-none">Inicia sesión</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
