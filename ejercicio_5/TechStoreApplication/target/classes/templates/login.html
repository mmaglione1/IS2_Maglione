<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore - Acceso al Sistema</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center py-5">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">

            <!-- Encabezado de Marca -->
            <div class="text-center mb-4">
                <i class="bi bi-cpu-fill text-primary display-4"></i>
                <h2 class="fw-bold mt-2">TechStore</h2>
                <p class="text-muted">Control de Stock y Compras Mayoristas</p>
            </div>

            <!-- Mensajes de Alerta Dinámicos -->
            <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Credenciales incorrectas</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${exito != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${exito}">Operación exitosa</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div th:if="${info != null}" class="alert alert-info alert-dismissible fade show" role="alert">
                <i class="bi bi-info-circle-fill me-2"></i>
                <span th:text="${info}">Sesión finalizada</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Tarjeta del Formulario -->
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4">
                    <form th:action="@{/login}" th:object="${loginDTO}" method="POST">

                        <!-- Nombre de Usuario -->
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       th:field="*{username}"
                                       placeholder="Ingresa tu usuario (ej: admin)"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-4">
                            <label for="clave" class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password"
                                       class="form-control"
                                       id="clave"
                                       th:field="*{clave}"
                                       placeholder="••••••••"
                                       th:classappend="${#fields.hasErrors('clave')} ? 'is-invalid' : ''" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></div>
                        </div>

                        <!-- Botón de Ingreso -->
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary fw-semibold py-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                            </button>
                        </div>

                        <div class="text-center">
                            <span class="text-muted small">¿Nuevo operador? </span>
                            <a th:href="@{/registro}" class="small fw-semibold text-decoration-none">Regístrate aquí</a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Footer Informativo -->
            <div class="text-center text-muted small mt-4">
                Credenciales por defecto: <strong>admin</strong> / <strong>1234</strong>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
