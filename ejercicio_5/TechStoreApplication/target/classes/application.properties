# ==============================================================================
# 1. CONFIGURACIÓN DEL SERVIDOR WEB (Tomcat Embebido)
# ==============================================================================
# Puerto HTTP en el que escuchará la aplicación para recibir las peticiones web
server.port=8080
# Nombre de la aplicación en el contexto de Spring Boot
spring.application.name=sistema-tecnologia-stock

# ==============================================================================
# 2. CAPA DE PERSISTENCIA / CONEXIÓN A BASE DE DATOS MYSQL (JDBC)
# ==============================================================================
# URL de conexión JDBC:
# - localhost:3306: Dirección y puerto estándar del servidor MySQL local.
# - tech_store_db: Nombre de la base de datos para el sistema de tecnología.
# - createDatabaseIfNotExist=true: Crea automáticamente el esquema si aún no existe en MySQL.
# - allowPublicKeyRetrieval=true: Permite la negociación segura de claves públicas en MySQL 8+.
# - serverTimezone=UTC: Estandariza la zona horaria para registrar fechas de compras y auditoría.
spring.datasource.url=jdbc:mysql://localhost:3306/tech_store_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Credenciales de acceso a MySQL (configuradas como root / 1234 según tu entorno)
spring.datasource.username=root
spring.datasource.password=1234

# Driver oficial de MySQL para establecer la comunicación por red
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# 3. CONFIGURACIÓN DEL ORM (JPA / HIBERNATE)
# ==============================================================================
# ddl-auto=update:
# Hibernate inspecciona las clases anotadas con @Entity (Producto, Proveedor, OrdenCompra, etc.)
# y crea o actualiza las tablas, columnas y claves foráneas automáticamente en MySQL sin borrar datos existentes.
spring.jpa.hibernate.ddl-auto=update

# Dialecto SQL específico para optimizar las consultas generadas para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Muestra en la consola todas las sentencias SQL (CREATE TABLE, INSERT, SELECT, UPDATE) generadas por el ORM
spring.jpa.show-sql=true

# Formatea el código SQL en varias líneas indentadas para facilitar la depuración
spring.jpa.properties.hibernate.format_sql=true

# Desactiva Open-In-View para promover una clara separación de capas y evitar transacciones abiertas en la vista
spring.jpa.open-in-view=false

# ==============================================================================
# 4. CONFIGURACIÓN DEL MOTOR DE VISTAS (THYMELEAF)
# ==============================================================================
# Prefijo y sufijo donde Spring MVC buscará los archivos HTML de las vistas
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Desactiva la caché de plantillas para que los cambios en los HTML se vean en tiempo real sin reiniciar el servidor
spring.thymeleaf.cache=false

# Codificación de caracteres estándar para caracteres especiales, acentos y 'ñ'
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML